<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penyebrangan Pintar - Dashboard</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/logo_utama.png') }}">

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --secondary-color: #f1f5f9;
            --success-color: #059669;
            --warning-color: #d97706;
            --danger-color: #dc2626;
            --background-color: #ffffff;
            --surface-color: #f8fafc;
            --surface-secondary: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --primary-color: #60a5fa;
            --primary-dark: #3b82f6;
            --primary-light: #93c5fd;
            --secondary-color: #1e293b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --background-color: #0f172a;
            --surface-color: #1e293b;
            --surface-secondary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --border-light: #475569;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3), 0 1px 2px 0 rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            transition: all 0.3s ease;
            line-height: 1.6;
        }

        .header {
            background: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);

        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-small {
            width: 60px;
            height: 40px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .logo-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.025em;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .info-btn, .theme-toggle {
            background: var(--background-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .info-btn:hover, .theme-toggle:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .info-btn:hover svg, .theme-toggle:hover svg {
            fill: white;
        }

        .info-btn svg, .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            padding: 0.5rem 1rem;
            background: var(--surface-secondary);
            border-radius: 10px;
            border: 1px solid var(--border-light);
        }

        .logout-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 0.625rem 1.25rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .logout-btn:hover {
            background: #b91c1c;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .main-content {
            padding: 1rem;
            max-width: 1600px;
            margin: 0;
        }
        @media (max-width: 1024px) {
            .main-dashboard-layout {
                grid-template-columns: 1fr; /* Stack columns on smaller screens */
            }
            
            .cam-content {
                flex-direction: column; /* Ensure vertical stacking */
                gap: 1.5rem;
            }
            
            .traffic-light-container {
                justify-self: center;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .header {
                padding: 1rem;
            }
            
            .header-title {
                font-size: 1rem; /* Smaller title on mobile */
            }

            .header-time-display {
                margin: 0 0.5rem;
            }
            .header-time-display .time {
                font-size: 1rem;
            }
            .header-time-display .date {
                font-size: 0.65rem;
            }

            .history-header {
                flex-direction: column;
                align-items: stretch;
            }

            .period-selector {
                justify-content: center;
            }

            .table-row {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }

            .chart-legend {
                flex-direction: column;
                gap: 0.5rem;
            }

            /* Updated responsive for 3 cards */
            .stats-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 columns for tablets */
            }

            .weather-cards-container {
                flex-direction: row; /* Keep weather cards in a row on tablets */
                flex-wrap: wrap;
                justify-content: space-between;
            }
            .weather-cards-container .env-card {
                flex: 1 1 calc(50% - 0.75rem); /* Two cards per row */
            }

            .modal-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr; /* 1 column for smaller tablets/mobile */
            }
            .weather-cards-container {
                flex-direction: column; /* Stack weather cards vertically on smaller screens */
            }
            .weather-cards-container .env-card {
                flex: 1 1 100%; /* Full width */
            }
        }

        @media (max-width: 640px) {
            .user-info span {
                display: none;
            }

            .date-range-picker {
                flex-direction: column;
                gap: 0.5rem;
            }

            .modal-content {
                margin: 0.5rem;
                padding: 1.5rem;
            }

            .modal-grid {
                grid-template-columns: 1fr;
            }
        }
        html, body {
          height: 100%;
          margin: 0;
          display: flex;
          flex-direction: column;
        }

        .page-content {
          flex: 1;
        }

        main {
        padding: 20px;
        }

        .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        }

        .card {
        background-color: #eaf0fa;
        border-radius: 12px;
        padding: 15px;
        box-shadow: 0 1px 5px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        }

        .card h3 {
        margin: 0 0 10px;
        font-weight: 600;
        }

        .card img, .img-placeholder {
        width: 100%;
        height: 300px;
        object-fit: cover;
        border-radius: 8px;
        background-color: #ccc;
        border: 1px solid #999;
        }

        .btn {
        margin-top: 10px;
        text-decoration: none;
        padding: 6px 12px;
        border: 1.5px solid #0041c4;
        border-radius: 6px;
        color: #0041c4;
        font-weight: 500;
        transition: all 0.2s ease;
        }

        .btn:hover {
        background-color: #0041c4;
        color: white;
        }

        footer {
          background: var(--surface-color);
          border-top: 1px solid var(--border-light);
          padding: 1rem 2rem;
          color: var(--text-muted);
          text-align: center;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo-small">
                <img id="logo-small" src="{{ url_for('static', filename='assets/logo_utama_fix.png') }}" alt="Smart Pedestrian Crossing Logo">
            </div>
            <h1 class="header-title">Penyebrangan Pintar</h1>

                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" style="display: none;">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <div class="user-info">
                <span>Admin</span>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>
        <div class="grid-container">
      <!-- Card -->
      <div class="card">

        <img src="{{ url_for('static', filename='assets/mim.png') }}" alt="Metro Indah Mall" />
        <a href="{{ url_for('dashboard') }}" class="btn">Dasbor Pemantauan</a>
      </div>
      <div class="card">
        <h3>Braga</h3>
        <img src="{{ url_for('static', filename='assets/mim.png') }}" alt="Braga" />
        <a href="{{ url_for('dashboard') }}" class="btn">Dasbor Pemantauan</a>
      </div>

        <div class="{{ url_for('static', filename='assets/mim.png') }}"></div>
        <a href="{{ url_for('dashboard') }}" class="btn">Dasbor Pemantauan</a>

      <div class="card">

      </div>
    </div>
  </main>
  <footer style="background: var(--surface-color); border-top: 1px solid var(--border-light); padding: 1rem 2rem; color: var(--text-muted); margin-top: 2rem;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <img src="{{ url_for('static', filename='assets/logo_utama.png') }}" alt="Logo" style="width: 60px; height: 40px; border-radius: 8px;">
        <div style="text-align: left;">
          <div><small>&copy; 2025 Smart Pedestrian Crossing. Semua Hak Dilindungi.</small></div>

        </div>

</footer>
</body>
</html>
